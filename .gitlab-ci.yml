image: python:3.13-slim

stages:
  - verify
  - package

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache/

before_script:
  - python -m pip install --disable-pip-version-check uv==0.13.5
  - uv sync --locked --group dev

verify:
  stage: verify
  script:
    - uv run --frozen ruff check .
    - uv run --frozen ruff format --check .
    - uv run --frozen pytest --cov=semaphoreui_mcp --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
    - uv run --frozen semaphoreui-mcp --list-tools
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

package:
  stage: package
  script:
    - uv run --frozen python -m build
  artifacts:
    paths:
      - dist/
