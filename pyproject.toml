[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semaphoreui-mcp"
version = "0.1.0"
description = "Model Context Protocol server for the Semaphore UI management API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/semaphoreui_mcp/data/SEMAPHORE-LICENSE"]
requires-python = ">=3.13"
keywords = ["mcp", "semaphore", "semaphoreui", "ansible", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "starlette>=0.48,<2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
semaphoreui-mcp = "semaphoreui_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.17,<1",
  "build>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semaphoreui_mcp = ["data/*", "data/licenses/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["semaphoreui_mcp"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
