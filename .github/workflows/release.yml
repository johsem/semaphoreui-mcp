name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to publish or retry (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out release tag and branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Verify tag, versions, main ancestry and published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease > release.json
          python scripts/check_release.py --tag "$RELEASE_TAG" \
            --release-json release.json --github-output "$GITHUB_OUTPUT"

  ci:
    name: Validate release
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  assets:
    name: Publish GitHub release assets
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Upload missing assets and verify existing checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > existing-assets.txt
          for file in dist/*.whl dist/*.tar.gz; do
            name=$(basename "$file")
            if grep -Fxq "$name" existing-assets.txt; then
              # Published bytes stay canonical when a retry rebuilds the distributions.
              gh release download "$RELEASE_TAG" --pattern "$name" --dir dist --clobber
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          if grep -Fxq SHA256SUMS existing-assets.txt; then
            gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir existing
            diff -u existing/SHA256SUMS dist/SHA256SUMS
          else
            gh release upload "$RELEASE_TAG" dist/SHA256SUMS
          fi

  container:
    name: Publish multi-platform container
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Set up emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve container name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: true
          sbom: true

  pypi:
    name: Publish to PyPI
    needs: [validate, assets]
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/semaphoreui-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download canonical release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          rm dist/SHA256SUMS

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  summary:
    name: Report publication results
    needs: [validate, ci, assets, container, pypi]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report each publication destination
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          CI_RESULT: ${{ needs.ci.result }}
          ASSETS_RESULT: ${{ needs.assets.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          PYPI_RESULT: ${{ needs.pypi.result }}
          PYPI_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED }}
        run: |
          {
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Release validation | $VALIDATION_RESULT |"
            echo "| CI | $CI_RESULT |"
            echo "| GitHub release assets | $ASSETS_RESULT |"
            echo "| GHCR image | $CONTAINER_RESULT |"
            echo "| PyPI | $PYPI_RESULT |"
            if [ "$PYPI_ENABLED" != true ]; then
              echo
              echo "PyPI publishing is disabled. Configure Trusted Publishing and set PYPI_PUBLISH_ENABLED=true."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
